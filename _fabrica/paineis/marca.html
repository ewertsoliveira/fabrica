  async function enviarManual(botao) {
    const m = tela.manual;
    if (!m) return;
    const vez = tela.vez;
    botao.disabled = true;
    mensagem('manual', 'Enviando o manual…', 'espera');
    try {
      if (!m.nome) {
        const r = await enviarArquivo('manual', m.arquivo);
        if (r === null || vez !== tela.vez) return;
        if (r.erro) { mensagem('manual', r.erro, 'erro'); return; }
        m.nome = r.nome;
      }
      const p = await enviarPedido('ler-manual', { anexos: [m.nome] });
      if (p === null || vez !== tela.vez) return;
      if (p.erro) { mensagem('manual', p.erro, 'erro'); return; }
      tela.manual = null;
      comFoco(desenharManual);
      mensagem('manual', p.mensagem, 'certo');
    } catch (e) {
      if (vez === tela.vez) mensagem('manual', SEM_SERVIDOR, 'erro');
    } finally {
      botao.disabled = false;
    }
  }

  // ---- o quadro, a comparação e o "Guardar" ----
  function podeGuardar() {
    const faltam = PAPEIS.filter((p) => !tela.cores[p]);
    if (faltam.length) return { ok: false, motivo: 'Falta escolher: ' + juntos(faltam.map((p) => NOME_PAPEL[p])) + '.' };
    if (!tela.definida && (!tela.letras.principal || !tela.letras.mono)) return { ok: false, motivo: 'Falta escolher a letra principal e a dos rótulos.' };
    if (!tela.sujo) return { ok: false, motivo: 'Nada mudou ainda.' };
    return { ok: true };
  }
  const comparar = () => tela.modo === 'marca' && !!coresDe(tela.marcaHoje) && /^estilo:/.test(tela.origem || '');
  function desenharQuadro() {
    const alvo = partes.quadro;
    if (!alvo) return;
    const pode = podeGuardar();
    const cores = coresCompletas() ? coresAgora() : null;
    const letras = { principal: tela.letras.principal, mono: tela.letras.mono };
    const filhos = [];
    const botoes = [];
    if (comparar()) {
      filhos.push(el('h2', { classe: 'campo-titulo', texto: 'A de hoje e a sua, lado a lado' }));
      filhos.push(el('p', { classe: 'recebemos' }, [el('b', { texto: 'Recebemos a sua marca.' }), ' Hoje a ' + tela.nome + ' usa as cores e letras ' + tela.doEstilo + '. Quer trocar?']));
      filhos.push(el('div', { classe: 'lado-a-lado' }, [
        quadroDaMarca(tela.marcaHoje.cores, tela.marcaHoje.letras, { legenda: 'Hoje · ' + tela.doEstilo }),
        cores ? quadroDaMarca(cores, letras, { legenda: 'Nova · a sua marca', classe: 'nova' }) : el('p', { classe: 'quadro-falta', texto: 'A sua marca aparece aqui quando as quatro cores estiverem escolhidas.' }),
      ]));
      const trocarBotao = el('button', { type: 'button', classe: 'botao principal', texto: 'Trocar pela minha marca', 'data-foco': 'guardar', disabled: !pode.ok, onclick: () => guardarMarca(botoes) });
      const manter = el('button', { type: 'button', classe: 'botao', texto: 'Manter como está', 'data-foco': 'manter', onclick: () => manterComoEsta() });
      botoes.push(trocarBotao, manter);
      filhos.push(el('div', { classe: 'acoes' }, botoes));
      filhos.push(el('p', { classe: 'nota', texto: COMPARACAO }));
    } else {
      filhos.push(el('h2', { classe: 'campo-titulo', texto: 'Assim fica a sua marca' }));
      filhos.push(cores ? quadroDaMarca(cores, letras) : el('p', { classe: 'quadro-falta', texto: 'O quadro aparece quando as quatro cores estiverem escolhidas.' }));
      const guardar = el('button', { type: 'button', classe: 'botao principal', texto: 'Guardar a minha marca', 'data-foco': 'guardar', disabled: !pode.ok, onclick: () => guardarMarca(botoes) });
      botoes.push(guardar);
      filhos.push(el('div', { classe: 'acoes' }, botoes));
    }
    if (cores) filhos.push(contrastes(cores));
    if (!pode.ok && pode.motivo !== 'Nada mudou ainda.') filhos.push(el('p', { classe: 'nota', texto: pode.motivo }));
    filhos.push(caixaDeMensagem('marca'));
    comFoco(() => encher(alvo, filhos));
  }
  function manterComoEsta() {
    tela.resposta = null;
    tela.sujo = false;
    soltarItem(tela.logo);
    tela.logo = null;
    tela.versao = null;
    tela.papelAberto = null;
    tela.ultimo = null;
    tela.letras = { principal: null, mono: null, acento: null };
    preencherEditor();
    mensagem('geral', 'Nada mudou. A ' + tela.nome + ' continua com as cores e letras ' + tela.doEstilo + '.', '');
    desenhar();
  }

  // Depois de guardar a marca: no Personalizar, o link volta para o estilo (que já abre na marca, se ela estiver
  // pronta; o aviso de que as prévias vão demorar vale também ali). Fora dele, com prévias na marca já prontas (`naMarca`), o link vai direto para elas; sem prévias prontas
  // ainda (a geração roda em segundo plano e pode não ter terminado), um aviso de que elas vão demorar um pouco mais.
  function textoDepoisDeGuardar(modo, naMarca) {
    if (modo === 'personalizar') return { texto: naMarca ? MARCA_GUARDADA : PREVIAS_DEMORAM, rotulo: 'Voltar para o estilo' };
    if (naMarca) return { texto: MARCA_GUARDADA, rotulo: VER_NA_MARCA };
    return { texto: PREVIAS_DEMORAM, rotulo: 'Ir para a biblioteca de estilos' };
  }

  async function guardarMarca(botoes) {
    const pode = podeGuardar();
    if (!pode.ok) { mensagem('marca', pode.motivo, 'erro'); return; }
    const vez = tela.vez;
    botoes.forEach((b) => { b.disabled = true; });
    mensagem('marca', 'Guardando a sua marca…', 'espera');
    let pronto = false;
    try {
      const corpo = { cores: {} };
      PAPEIS.forEach((p) => { corpo.cores[p] = tela.cores[p].cor; });
      if (tela.logo && !tela.logo.erro && !tela.logo.guardado) {
        if (!tela.logo.nome) {
          const r = await enviarArquivo('logo', tela.logo.arquivo);
          if (r === null || vez !== tela.vez) return;
          if (r.erro) { mensagem('marca', 'O logo não foi guardado: ' + r.erro, 'erro'); return; }
          tela.logo.nome = r.nome;
        }
        corpo.logo = tela.logo.nome;
      }
      const fontes = {};
      for (const p of PAPEIS_LETRA) {
        const l = tela.letras[p];
        if (!l || l.de === 'marca') continue;
        if (l.nenhuma) { if (p === 'acento') fontes[p] = ''; continue; }
        if (l.arquivoLocal) {
          if (!l.nomeEnviado) {
            const r = await enviarArquivo('fonte', l.arquivoLocal);
            if (r === null || vez !== tela.vez) return;
            if (r.erro) { mensagem('marca', 'A letra ' + DA_LETRA[p] + ' não foi guardada: ' + r.erro, 'erro'); return; }
            l.nomeEnviado = r.nome;
          }
          fontes[p] = { enviada: l.nomeEnviado };
        } else if (l.arquivo) fontes[p] = { lista: l.arquivo };
      }
      if (Object.keys(fontes).length) corpo.fontes = fontes;
      corpo.origem = corpo.logo || PAPEIS.some((p) => tela.cores[p].de === 'logo') ? 'logo' : 'pessoa';
      const r = await seletor.enviar('/api/marca', corpo);
      if (r === null || vez !== tela.vez) return;
      if (!r.ok) { mensagem('marca', erroDe(r, 'Não consegui guardar a sua marca. Tente de novo.'), 'erro'); return; }
      // guardada: o que está na tela passa a ser a marca de hoje
      PAPEIS.forEach((p) => { tela.cores[p] = { cor: tela.cores[p].cor, de: 'marca' }; });
      PAPEIS_LETRA.forEach((p) => { if (tela.letras[p]) tela.letras[p] = Object.assign({}, tela.letras[p], { de: 'marca' }); });
      if (tela.logo) tela.logo.guardado = true;
      tela.sujo = false;
      tela.versao = null;
      tela.definida = true;
      tela.origem = corpo.origem;
      tela.sugeridaPedida = null;
      pronto = true;
      // Se as prévias na marca já estiverem prontas (pedidas pelo gatilho de uma gravação de antes), o link vai direto
      // para elas; senão, o aviso diz que elas vão demorar um pouco mais (a geração desta gravação roda em segundo
      // plano). Sem como conferir agora, fica o aviso (a opção mais conservadora: nunca promete o que ainda não existe).
      let naMarca = false;
      try {
        const b = await seletor.ler('/api/biblioteca');
        if (vez === tela.vez && b && b.ok) naMarca = objeto(objeto(b.json).marca).naMarca === true;
      } catch (e) { /* sem isso, fica o aviso de que as prévias vão demorar */ }
      if (vez !== tela.vez) return;
      const dep = textoDepoisDeGuardar(tela.modo, naMarca);
      mensagem('marca', dep.texto, 'certo', () => [
        el('button', { type: 'button', classe: 'botao', texto: 'Desfazer', 'data-foco': 'desfazer', onclick: (ev) => desfazerMarca(ev.currentTarget) }),
        el('a', { href: tela.modo === 'personalizar' ? enderecoDoEstilo(tela.estiloAberto) : 'estilos.html?empresa=' + encodeURIComponent(seletor.atual()), texto: dep.rotulo }),
      ]);
      seletor.aplicarMarca().catch(() => { /* o painel fica com as cores de antes até recarregar */ });
    } catch (e) {
      if (vez === tela.vez) mensagem('marca', SEM_SERVIDOR, 'erro');
    } finally {
      botoes.forEach((b) => { b.disabled = false; });
      if (pronto && vez === tela.vez) {
        atualizar(); // o botão de guardar fica desligado até a próxima mudança
        const d = conteudo.querySelector('[data-foco="desfazer"]');
        if (d) d.focus();
      }
    }
  }
  async function desfazerMarca(botao) {
    const vez = tela.vez;
    botao.disabled = true;
    try {
      const r = await seletor.enviar('/api/marca/desfazer', {});
      if (r === null || vez !== tela.vez) return;
      if (!r.ok) { mensagem('marca', erroDe(r, 'Não consegui desfazer agora. Tente de novo.'), 'erro'); return; }
      tela.mensagens.geral = { texto: 'Pronto. A marca voltou a ser a de antes.', tipo: 'certo', acoes: null };
      tela.sujo = false;
      await carregarEmpresa('de-novo');
    } catch (e) {
      if (vez === tela.vez) mensagem('marca', SEM_SERVIDOR, 'erro');
    } finally {
      botao.disabled = false;
    }
  }

  // ---- "Ainda não tenho": os três caminhos ----
  function desenharSemMarca(alvo) {
    const codigo = seletor.atual();
    const cam = (icone, titulo, apoio, extra) => [el('span', { classe: 'caminho-icone', 'aria-hidden': 'true', texto: icone }), el('span', {}, [el('b', { texto: titulo }), el('span', { texto: apoio }), extra || null])];
    // os ids são as âncoras que a tela de Estilos usa (marca.html?empresa=<c>#criar-do-zero e #enviar-referencias)
    const zero = el('div', { classe: 'caminho-area', id: 'criar-do-zero', hidden: !tela.abertos.zero });
    const refs = el('div', { classe: 'caminho-area', id: 'enviar-referencias', hidden: !tela.abertos.referencias });
    partes.zero = zero; partes.referencias = refs;
    const botaoZero = el('button', { type: 'button', classe: 'caminho', 'aria-expanded': String(tela.abertos.zero), 'aria-controls': 'criar-do-zero', 'data-foco': 'caminho-zero', onclick: () => { tela.abertos.zero = !tela.abertos.zero; botaoZero.setAttribute('aria-expanded', String(tela.abertos.zero)); zero.hidden = !tela.abertos.zero; if (!zero.hidden) { const t = zero.querySelector('textarea'); if (t) t.focus(); } } },
      cam('✎', 'Criar uma identidade do zero', 'Algumas perguntas sobre o seu negócio e o seu público; a Fábrica propõe paletas e letras, sempre com prévia, e você escolhe.'));
    const botaoRefs = el('button', { type: 'button', classe: 'caminho', 'aria-expanded': String(tela.abertos.referencias), 'aria-controls': 'enviar-referencias', 'data-foco': 'caminho-referencias', onclick: () => { tela.abertos.referencias = !tela.abertos.referencias; botaoRefs.setAttribute('aria-expanded', String(tela.abertos.referencias)); refs.hidden = !tela.abertos.referencias; } },
      cam('⇪', 'Enviar referências do que você gosta', 'Imagens ou prints. A Fábrica cria um estilo próprio inspirado nelas, sem copiar.'));
    alvo.append(
      el('h2', { texto: 'Como você quer começar?' }),
      el('div', { classe: 'caminhos' }, [
        el('a', { classe: 'caminho', href: 'estilos.html?empresa=' + encodeURIComponent(codigo) }, cam('▦', 'Usar um dos nossos modelos', 'Você escolhe na biblioteca, e as cores e letras do modelo viram as da sua marca.', el('em', { texto: 'Mais rápido' }))),
        botaoZero, zero, botaoRefs, refs,
      ]),
    );
    desenharZero(); desenharReferencias();
  }
  function campoDeRecado(rotulo, chave, foco) {
    const area = el('textarea', { classe: 'recado', maxlength: String(LIMITE_RECADO), 'data-foco': foco, id: 'recado-' + foco });
    area.value = tela[chave];
    const conta = el('span', { classe: 'contador', 'aria-live': 'off', texto: area.value.length + ' de ' + LIMITE_RECADO });
    area.addEventListener('input', () => { tela[chave] = area.value; conta.textContent = area.value.length + ' de ' + LIMITE_RECADO; });
    return el('div', { style: 'display:grid;gap:6px' }, [el('label', { classe: 'rotulo', for: 'recado-' + foco }, rotulo), area, conta]);
  }
  function desenharZero() {
    const alvo = partes.zero;
    const botao = el('button', { type: 'button', classe: 'botao principal', texto: 'Pedir a identidade do zero', 'data-foco': 'pedir-zero', onclick: async () => {
      const vez = tela.vez;
      botao.disabled = true;
      mensagem('zero', 'Guardando o pedido…', 'espera');
      try {
        const p = await enviarPedido('criar-do-zero', { nota: tela.recadoZero });
        if (p === null || vez !== tela.vez) return;
        if (p.erro) { mensagem('zero', p.erro, 'erro'); return; }
        tela.recadoZero = '';
        const area = alvo.querySelector('textarea'); if (area) { area.value = ''; area.dispatchEvent(new Event('input')); }
        mensagem('zero', p.mensagem, 'certo');
      } catch (e) { if (vez === tela.vez) mensagem('zero', SEM_SERVIDOR, 'erro'); } finally { botao.disabled = false; }
    } });
    encher(alvo, [
      campoDeRecado([el('span', { texto: 'Conte um pouco do seu negócio e do seu público ' }), el('small', { texto: '(opcional)' })], 'recadoZero', 'zero'),
      el('p', { classe: 'nota', texto: 'No Claude, a Fábrica faz algumas perguntas e mostra paletas e letras lado a lado. Nada muda na sua marca sem você escolher.' }),
      el('div', { classe: 'acoes' }, [botao]),
      caixaDeMensagem('zero'),
    ]);
  }
  function desenharReferencias() {
    const alvo = partes.referencias;
    if (!alvo) return;
    const entrada = el('input', { type: 'file', accept: QUALQUER_IMAGEM, multiple: true, classe: 'so-leitor', 'data-foco': 'referencias-arquivo', onchange: (ev) => { const fs = ev.target.files ? Array.from(ev.target.files) : []; ev.target.value = ''; acrescentarReferencias(fs); } });
    const solta = el('label', { classe: 'solta' }, [el('b', { texto: 'Solte as imagens aqui' }), el('span', { texto: 'ou clique para escolher · até ' + MAXIMO_REFERENCIAS }), entrada]);
    aceitarSoltar(solta, acrescentarReferencias);
    const mins = el('ul', { classe: 'miniaturas' }, tela.referencias.map((item, i) => el('li', {}, [
      miniatura(item, 'Referência ' + (i + 1)),
      el('button', { type: 'button', classe: 'tirar', texto: '×', 'aria-label': 'Tirar a imagem ' + (i + 1), 'data-foco': 'tirar-' + i, onclick: () => { soltarItem(item); tela.referencias.splice(i, 1); comFoco(desenharReferencias); const d = alvo.querySelector('[data-foco="referencias-arquivo"]'); if (document.activeElement === document.body && d) d.focus(); } }),
    ])));
    const botao = el('button', { type: 'button', classe: 'botao principal', texto: 'Enviar referências', 'data-foco': 'enviar-referencias', disabled: !tela.referencias.length, onclick: () => enviarReferencias(botao) });
    encher(alvo, [
      el('h3', { classe: 'campo-titulo', texto: 'Mande imagens do que você gosta' }),
      el('p', { classe: 'nota', texto: 'Fotos, prints, posts que você salvou. A Fábrica cria um estilo próprio inspirado nelas, sem copiar.' }),
      solta,
      tela.referencias.length ? mins : null,
      el('p', { classe: 'nota', texto: tela.referencias.length + ' de ' + MAXIMO_REFERENCIAS + ' imagens' }),
      campoDeRecado([el('span', { texto: 'Quer contar alguma coisa? ' }), el('small', { texto: '(opcional)' })], 'recadoRef', 'referencias'),
      el('div', { classe: 'acoes' }, [botao]),
      caixaDeMensagem('referencias'),
    ]);
  }
  function acrescentarReferencias(arquivos) {
    const recusas = [];
    arquivos.forEach((f) => {
      if (tela.referencias.length >= MAXIMO_REFERENCIAS) { recusas.push('Cabem até ' + MAXIMO_REFERENCIAS + ' imagens; as outras ficaram de fora.'); return; }
      if (!/^image\//.test(f.type || '')) { recusas.push('Um dos arquivos não é imagem e ficou de fora.'); return; }
      const grande = conferirTamanho('referencia', f.size);
      if (grande) { recusas.push('Uma imagem ficou de fora. ' + grande); return; }
      tela.referencias.push(itemDeArquivo(f));
    });
    comFoco(desenharReferencias);
    mensagem('referencias', [...new Set(recusas)].join(' '), recusas.length ? 'erro' : '');
  }
  async function enviarReferencias(botao) {
    const vez = tela.vez;
    const itens = tela.referencias.slice();
    if (!itens.length) return;
    botao.disabled = true;
    try {
      for (let i = 0; i < itens.length; i++) {
        if (itens[i].nome) continue;
        mensagem('referencias', 'Enviando a imagem ' + (i + 1) + ' de ' + itens.length + '…', 'espera');
        const r = await enviarArquivo('referencia', itens[i].arquivo);
        if (r === null || vez !== tela.vez) return;
        if (r.erro) { mensagem('referencias', 'A imagem ' + (i + 1) + ' não foi enviada: ' + r.erro, 'erro'); return; }
        itens[i].nome = r.nome;
      }
      const p = await enviarPedido('enviar-referencias', { anexos: itens.map((x) => x.nome), nota: tela.recadoRef });
      if (p === null || vez !== tela.vez) return;
      if (p.erro) { mensagem('referencias', p.erro, 'erro'); return; }
      itens.forEach(soltarItem);
      tela.referencias = [];
      tela.recadoRef = '';
      comFoco(desenharReferencias);
      mensagem('referencias', p.mensagem, 'certo');
    } catch (e) {
      if (vez === tela.vez) mensagem('referencias', SEM_SERVIDOR, 'erro');
    } finally {
      botao.disabled = !tela.referencias.length;
    }
  }

  // ---- Personalizar ----
  function desenharPersonalizar(miolo) {
    const e = tela.estiloAberto;
    miolo.appendChild(el('section', { classe: 'secao' }, [
      el('h2', { texto: 'Cores e letras da sua marca' }),
      el('p', { classe: 'apoio', texto: 'Troque as cores e as letras da ' + tela.nome + '. O estilo ' + e.nome + ' continua o mesmo; só as cores e as letras mudam, e valem para todos os estilos da sua marca. Nada muda até você guardar.' }),
    ]));
    partes.ramo = el('div', { classe: 'secao' });
    miolo.appendChild(partes.ramo);
    desenharEditor(partes.ramo, { comLogo: false, comManual: false });
    miolo.appendChild(secaoDetalhes(e));
    miolo.appendChild(el('p', {}, [el('a', { href: enderecoDoEstilo(e), texto: 'Voltar para o estilo ' + e.nome })]));
  }
  // Detalhes de estrutura (decisão D6): viram o pedido "personalizar" com os detalhes marcados; o agente mostra as opções.
  // Estilo próprio da empresa: o pedido "personalizar" só aceita estilo do catálogo (pedidos.js), então nada é pedido daqui.
  function secaoDetalhes(estilo) {
    if (estilo.proprio) {
      return el('section', { classe: 'secao campo', 'aria-labelledby': 'detalhes-titulo' }, [
        el('h2', { id: 'detalhes-titulo', classe: 'campo-titulo', texto: 'Detalhes do estilo' }),
        el('p', { classe: 'nota', texto: 'Os detalhes de um estilo seu são ajustados no Claude: digite /fabrica e conte o que você quer mudar no estilo ' + estilo.nome + '. Por esta tela dá para trocar as cores e as letras da sua marca, acima.' }),
      ]);
    }
    const caixas = DETALHES.map((d) => {
      const c = el('input', { type: 'checkbox', value: d.valor, 'data-foco': 'detalhe-' + d.valor });
      c.checked = tela.detalhes.includes(d.valor);
      c.addEventListener('change', () => { tela.detalhes = DETALHES.map((x) => x.valor).filter((v) => (v === d.valor ? c.checked : tela.detalhes.includes(v))); });
      return el('label', {}, [c, d.rotulo]);
    });
    const botao = el('button', { type: 'button', classe: 'botao principal', texto: 'Pedir estes detalhes', 'data-foco': 'pedir-detalhes', onclick: async () => {
      if (!tela.detalhes.length && !tela.recadoDetalhes.trim()) { mensagem('detalhes', 'Marque um detalhe ou conte o que você quer mudar.', 'erro'); return; }
      const vez = tela.vez;
      botao.disabled = true;
      mensagem('detalhes', 'Guardando o pedido…', 'espera');
      try {
        const p = await enviarPedido('personalizar', { estilo: estilo.id, detalhes: tela.detalhes, nota: tela.recadoDetalhes });
        if (p === null || vez !== tela.vez) return;
        if (p.erro) { mensagem('detalhes', p.erro, 'erro'); return; }
        mensagem('detalhes', p.mensagem, 'certo');
      } catch (e) { if (vez === tela.vez) mensagem('detalhes', SEM_SERVIDOR, 'erro'); } finally { botao.disabled = false; }
    } });
    return el('section', { classe: 'secao campo', 'aria-labelledby': 'detalhes-titulo' }, [
      el('h2', { id: 'detalhes-titulo', classe: 'campo-titulo', texto: 'Detalhes do estilo' }),
      el('p', { classe: 'nota', texto: 'Estes detalhes mudam a estrutura do estilo ' + estilo.nome + '. Quem ajusta é a Fábrica, no Claude, mostrando as opções lado a lado para você escolher.' }),
      el('fieldset', { classe: 'detalhes-lista' }, [el('legend', { classe: 'so-leitor', texto: 'Detalhes que você quer mudar' })].concat(caixas)),
      campoDeRecado([el('span', { texto: 'O que você quer mudar? ' }), el('small', { texto: '(opcional)' })], 'recadoDetalhes', 'detalhes'),
      el('div', { classe: 'acoes' }, [botao]),
      caixaDeMensagem('detalhes'),
    ]);
  }

  // A âncora que muda com a página aberta (um link de Estilos na mesma aba): abre a seção, sem perder o que está na tela.
  window.addEventListener('hashchange', () => {
    const ancora = ancoraDoEndereco(location.hash);
    if (!ancora || tela.modo !== 'marca' || !partes.ramo) return;
    tela.resposta = 'nao';
    tela.abertos[ancora] = true;
    desenhar();
    mostrarAncora(ancora);
  });

  iniciar();
})();
</script>
</body>
</html>
