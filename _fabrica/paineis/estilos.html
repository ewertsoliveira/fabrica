    const area = $('pedido-area');
    if (area && !area.hidden) { fecharPedido(); return; }
    fecharDetalhe();
  });

  function pararVideoDoDetalhe() { detalhe.querySelectorAll('video').forEach((v) => v.pause()); }

  // As abas que o estilo tem (só o que tem prévia), na ordem da tela. `p` são as prévias já conferidas.
  function abasDe(p) {
    const abas = [];
    if (p.video) abas.push('video');
    if (p.carrossel.length) abas.push('carrossel');
    if (p.reelsCapa) abas.push('capa-reels');
    if (p.fixados.length) abas.push('fixados');
    return abas;
  }

  // A aba que abre primeiro: o primeiro formato que a empresa quer e o estilo tem; senão o Carrossel; senão a primeira.
  function primeiraAba(abas, intencao) {
    const querida = intencao.find((q) => abas.includes(q));
    if (querida) return querida;
    return abas.includes('carrossel') ? 'carrossel' : (abas[0] || null);
  }

  // As prévias do detalhe na vista de agora. Na marca, cada formato vem da marca quando existe; o que ainda não existe na
  // marca fica na base (`daMarca[aba]` falso: a aba diz "Modelo base").
  function previasDoDetalhe(estilo) {
    // as prévias base já conferidas no item (as do estilo próprio, só da pasta da empresa)
    const base = {
      video: estilo.video,
      videoCapa: estilo.videoCapa,
      carrossel: estilo.carrossel,
      reelsCapa: estilo.reelsCapa,
      fixados: estilo.fixados,
      naMarca: false,
      daMarca: {},
    };
    const m = tela.vista === 'marca' ? estilo.marca : null;
    if (!m) return base;
    const daMarca = { video: !!m.video, carrossel: m.carrossel.length > 0, 'capa-reels': !!m.reelsCapa, fixados: m.fixados.length > 0 };
    return {
      video: m.video || base.video,
      videoCapa: m.video ? m.videoCapa : base.videoCapa,
      carrossel: daMarca.carrossel ? m.carrossel : base.carrossel,
      reelsCapa: m.reelsCapa || base.reelsCapa,
      fixados: daMarca.fixados ? m.fixados : base.fixados,
      naMarca: true,
      daMarca,
    };
  }

  const imagem = (src, alt) => el('img', { src, alt, decoding: 'async', draggable: 'false' });

  function mostrarDetalhe(estilo) {
    pararTudo();
    pararVideoDoDetalhe();
    if (detalhe.hidden) aberto.rolagem = window.scrollY;

    detalhe.textContent = '';
    if (estilo.fundo) detalhe.style.setProperty('--fundo-estilo', estilo.fundo); else detalhe.style.removeProperty('--fundo-estilo');

    ]));
    detalhe.appendChild(el('div', { classe: 'detalhe-corpo' }, [desenharPrevias(estilo, previas), desenharInfo(estilo, titulo, previas)]));

  }

  const PROXIMO = 'Seu vídeo deste estilo é o próximo a ficar pronto.';
  async function priorizarVideo(estilo) {
    const vez = aberto.vez;
    const r = await enviarPrevias({ acao: 'priorizar', estilo: estilo.id });
    if (r === null || vez !== aberto.vez || !r.ok) return;
    aberto.priorizado = true;
    const notaDoVideoNaTela = $('video-nota');
    if (notaDoVideoNaTela) notaDoVideoNaTela.textContent = PROXIMO;
    aplicarProgresso(objeto(r.json).estado);
  }
  // O que a aba Vídeo diz quando o vídeo na marca ainda não existe (o que toca é o vídeo base).
  function notaDoVideo(estilo) {
    const v = estilo.videoMarca;
    if (v === 'fazendo') return 'Seu vídeo deste estilo está sendo feito agora. Até lá, este é o modelo base.';
    if (v === 'esperando') return aberto.priorizado ? PROXIMO : 'Seu vídeo deste estilo ainda vai ser feito. Até lá, este é o modelo base.';
    if (v === 'sem-fonte') return 'O vídeo de demonstração não está neste computador, então o vídeo deste estilo fica no modelo base.';
    if (v === 'sem-modelo') return 'O vídeo deste estilo ainda não troca as cores pelas da sua marca; ele fica no modelo base.';
    if (v === 'erro') return 'Não deu para fazer o vídeo deste estilo na sua marca; ele fica no modelo base.';
    return 'Este é o vídeo no modelo base.';
  }

  // ---- à esquerda: as prévias em abas ----
  function desenharPrevias(estilo, previas) {
    const abas = abasDe(previas);
    const caixa = el('div', { classe: 'detalhe-previas' });
    if (!abas.length) {
      caixa.appendChild(quadroSemPrevia(estilo.nome));
      return caixa;
    }
    const painel = el('div', { classe: 'aba-painel', role: 'tabpanel', id: 'aba-painel' });
    // na marca, o formato que ainda não existe nela mostra a base e diz "Modelo base" na própria aba

      classe: 'aba', type: 'button', role: 'tab', id: 'aba-' + a, 'data-aba': a, 'aria-controls': 'aba-painel',
      texto: ROTULO_ABA[a], onclick: () => escolher(a),

    let atual = null;
    function escolher(a) {
      pararVideoDoDetalhe();

      painel.textContent = '';
      if (a === 'video') painel.appendChild(quadroVideo(estilo, previas));
      else if (a === 'carrossel') painel.appendChild(slider(estilo, previas.carrossel));

  // O vídeo do detalhe nasce parado (preload none, só a capa): toca quando a pessoa aperta o play, e daí em diante
  // ficam os controles do próprio navegador.
  function quadroVideo(estilo, previas) {
    const video = el('video', { classe: 'detalhe-video', src: previas.video, poster: previas.videoCapa, preload: 'none', playsinline: true, 'aria-label': 'Vídeo de exemplo do estilo ' + estilo.nome });
    const play = el('button', { classe: 'detalhe-play', type: 'button', id: 'detalhe-play' }, [el('span', { classe: 'icone-tocar', 'aria-hidden': 'true' }), 'Ver o vídeo']);
    const quadro = el('div', { classe: 'quadro-alto' }, [video, play]);
    play.addEventListener('click', () => tocarVideoDoDetalhe(video, play));
    video.addEventListener('error', () => quadro.replaceWith(el('p', { classe: 'sem-previa', texto: 'Não consegui abrir o vídeo deste estilo. As outras prévias continuam nas abas.' })));
    if (!previas.naMarca || previas.daMarca.video) return quadro;
    return el('div', {}, [quadro, el('p', { classe: 'video-nota', id: 'video-nota', texto: notaDoVideo(estilo) })]);
  }
  function tocarVideoDoDetalhe(video, play) {
    pararTudo();
    video.controls = true;
    play.remove();
    video.focus({ preventScroll: true });
    const promessa = video.play();
    if (promessa && promessa.catch) promessa.catch(() => { /* parado antes de começar: os controles continuam ali */ });
  }

  // Carrossel: uma lâmina por vez. Passa arrastando (mouse ou dedo), pelas setas do teclado ou pelos botões.
  function slider(estilo, laminas) {
    const total = laminas.length;
    let i = 0;
    let inicio = null;
    let arrasto = 0;
    const trilho = el('div', { classe: 'slider-trilho' }, laminas.map((src, k) => el('div', {
      classe: 'slide', role: 'group', 'aria-roledescription': 'lâmina', 'aria-label': (k + 1) + ' de ' + total,
    }, [imagem(src, 'Lâmina ' + (k + 1) + ' do carrossel do estilo ' + estilo.nome)])));
    const janela = el('div', {
      classe: 'slider-janela', id: 'slider', tabindex: '0', role: 'region', 'aria-roledescription': 'carrossel',
      'aria-label': 'Carrossel do estilo ' + estilo.nome + '. Use as setas do teclado para passar as lâminas.',
    }, [trilho]);
    const contador = el('p', { classe: 'slider-contador', id: 'slider-contador' });
    const antes = el('button', { classe: 'slider-seta', type: 'button', id: 'slider-antes', 'aria-label': 'Lâmina anterior', onclick: () => ir(i - 1) }, [el('span', { 'aria-hidden': 'true', texto: '‹' })]);
    const depois = el('button', { classe: 'slider-seta', type: 'button', id: 'slider-depois', 'aria-label': 'Próxima lâmina', onclick: () => ir(i + 1) }, [el('span', { 'aria-hidden': 'true', texto: '›' })]);
    function ir(k) {
      i = Math.max(0, Math.min(total - 1, k));
      trilho.style.transform = 'translateX(' + (-i * 100) + '%)';
      [...trilho.children].forEach((s, n) => { if (n === i) s.removeAttribute('aria-hidden'); else s.setAttribute('aria-hidden', 'true'); });
      contador.textContent = (i + 1) + ' de ' + total;
      antes.disabled = i === 0;
      depois.disabled = i === total - 1;
    }
    janela.addEventListener('keydown', (ev) => {
      const destino = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: total - 1 }[ev.key];
      if (destino === undefined) return;
      ev.preventDefault();
      ir(destino);
    });
    janela.addEventListener('pointerdown', (ev) => {
      if (ev.button !== 0 || total < 2) return;
      inicio = ev.clientX;
      arrasto = 0;
      try { janela.setPointerCapture(ev.pointerId); } catch (e) { /* o arraste segue sem a captura */ }
      janela.classList.add('arrastando');
    });
    janela.addEventListener('pointermove', (ev) => {
      if (inicio === null) return;
      arrasto = ev.clientX - inicio;
      trilho.style.transform = 'translateX(calc(' + (-i * 100) + '% + ' + arrasto + 'px))';
    });
    const soltar = () => {
      if (inicio === null) return;
      inicio = null;
      janela.classList.remove('arrastando');
      const limiar = Math.min(60, janela.clientWidth * 0.15);
      ir(Math.abs(arrasto) > limiar ? i + (arrasto < 0 ? 1 : -1) : i);
    };
    janela.addEventListener('pointerup', soltar);
    janela.addEventListener('pointercancel', soltar);
    ir(0);
    return el('div', { classe: 'slider' }, [janela, el('div', { classe: 'slider-controles' }, [antes, contador, depois])]);
  }

  function quadroFixados(estilo, fixados) {

  const legivel = (v) => String(v).replace(/\+/g, ' + ').replace(/-/g, ' ');

  // As amostras de cor de um papel a outro, na ordem de NOME_COR. `todas`: papel sem cor vira um quadrado vazio (assim, na

  function amostrasDe(cores, rotulo, todas) {

  function nomeDaLetra(u) {

  // ---- detalhe na marca: o texto difícil de ler, as cores sugeridas e "Como ficaria" (decisão D5 B, com a correção do
  // responsável: sugerir 2 a 3 cores que funcionam e combinam, cada uma com a peça feita com ela; nunca gravar a marca) ----
  const DO_PAPEL = { escuro: 'do escuro', claro: 'do claro', acento: 'do acento', neutro: 'do neutro' };
  const ESTILO_DIFICIL = 'Este estilo deixa o texto difícil de ler com a sua marca; que tal outro estilo?';
  // o que acontece no "Usar esta cor" (fluxo da etapa 8): abre Personalizar já com a cor; a marca só muda quando a pessoa guarda
  const USAR_COR_NOTA = '“Usar esta cor” abre Personalizar, em Sua marca, já com a cor escolhida; a sua marca só muda quando você guardar ali.';
  const DETALHE_PEQUENO ='Um detalhe pequeno deste estilo fica um pouco abaixo do ideal de leitura com a sua marca.';
  // n = estilos da empresa ainda sem prévia válida na marca (erro, em preparo, novos): ficam fora da conta.
  function valeParaTodos(n) {
    const inicio = 'Usar uma cor troca a cor da sua marca: a cor muda em todos os estilos da sua marca, e só é sugerida se nenhum texto que hoje se lê';
    if (!(n > 0)) return inicio + ', em nenhum deles, ficar difícil.';
    return inicio + ' nos estilos já prontos ficar difícil. ' + (n === 1 ? '1 estilo ainda não foi conferido.' : n + ' estilos ainda não foram conferidos.');
  }
  const juntos = (l) => (l.length > 1 ? l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1] : l[0] || '');
  // As peças em palavras, até 3 ("da lâmina 1, da lâmina 2, da lâmina 3 e de mais 2 peças").
  function pecasEmPalavras(pecas) {
    const nomes = pecas.map(ondeDaPeca).filter(Boolean);
    if (nomes.length <= 3) return juntos(nomes);
    return nomes.slice(0, 3).join(', ') + ' e de mais ' + (nomes.length - 3) + ' peças';
  }
  function desenharLeitura(estilo) {
    const m = estilo.marca;
    if (!m) return null;
    const outros = m.avisos.filter((a) => !/difícil de ler/.test(a));
    if (!m.leitura.length && !outros.length) return null;
    const filhos = [];
    m.leitura.forEach((g) => {
      if (g.tipo === 'detalhe') {
        filhos.push(el('p', {}, [DETALHE_PEQUENO + ' Fica no texto ' + juntos(g.onde) + '.']));
        return;
      }
      if (g.tipo === 'estilo') {
        filhos.push(el('p', {}, [el('strong', { texto: ESTILO_DIFICIL }), ' Acontece no texto ' + juntos(g.onde) + '.']));
        return;
      }
      filhos.push(el('p', {}, [el('strong', { texto: 'Com as suas cores, o texto ' + juntos(g.onde) + ' fica difícil de ler.' })]));
      if (g.sugestoes.length) {
        filhos.push(el('p', { texto: 'Cores que resolvem e combinam com a sua marca, no lugar ' + DO_PAPEL[g.papel] + (g.pecas.length > 1 ? ' (cada uma serve para todas estas peças):' : ':') }));
        filhos.push(el('ul', { classe: 'sugestoes' }, g.sugestoes.map((s) => sugestao(estilo, g, s))));
        if (!filhos.some((x) => x.classList && x.classList.contains('vale-para-todos'))) filhos.push(el('p', { classe: 'vale-para-todos', texto: valeParaTodos(tela.marca.semConferir) + ' ' + USAR_COR_NOTA }));
      }
    });
    if (m.leitura.filter((g) => g.tipo === 'cor' && g.sugestoes.length).length > 1) filhos.push(el('p', { classe: 'leitura-uma-vez', texto: 'Escolha uma troca por vez; depois as sugestões são refeitas.' }));
    if (outros.length) filhos.push(el('ul', { classe: 'leitura-outros' }, outros.map((a) => el('li', { texto: a }))));
    return el('section', { classe: 'leitura', id: 'leitura', 'aria-label': 'Leitura com a sua marca' }, filhos);
  }
  function sugestao(estilo, g, s) {
    const q = el('span', { classe: 'amostra-cor', 'aria-hidden': 'true' });
    q.style.setProperty('--amostra', s.cor);
    const ver = el('div', { classe: 'sugestao-ver', hidden: true });
    const estado = el('p', { classe: 'sugestao-estado', role: 'status' });
    const nome = (s.rotulo || 'Outra cor') + ', ' + s.cor;
    const comoFica = el('button', { classe: 'botao botao-mini', type: 'button', texto: 'Como ficaria',
      'aria-label': 'Como ficaria: ' + nome + ', no texto ' + pecasEmPalavras(g.pecas) });
    comoFica.addEventListener('click', () => verComoFicaria(estilo, g, s, comoFica, ver, estado));
    // "Usar esta cor" é um link para "Personalizar" em Sua marca, já com o papel e a cor (sem endereço conferido, sem link)
    const usar = usarCor(estilo, g, s) ? el('a', { classe: 'botao botao-mini botao-forte', texto: 'Usar esta cor', href: usarCor(estilo, g, s),
      'aria-label': 'Usar esta cor: ' + nome + ' no lugar ' + DO_PAPEL[g.papel] + ', para o texto ' + pecasEmPalavras(g.pecas) }) : null;
    return el('li', { classe: 'sugestao' }, [q, el('div', { classe: 'sugestao-nome' }, [el('strong', { texto: s.rotulo || 'Outra cor' }), el('span', { classe: 'codigo', texto: s.cor })]),
      el('div', { classe: 'sugestao-botoes' }, [comoFica, usar]), estado, ver]);
  }
  // Um texto que a cor estragaria, em palavras: “café”, na lâmina 1 do estilo Cartilha (o nome do estilo e o texto vêm do servidor, limpos).
  function textoPiorado(p) {
    const t = limpo(p.texto, 40);
    return (t ? '“' + t + '”' : 'um texto') + ', n' + ondeDaPeca(p).slice(1) + ' do estilo ' + (limpo(p.nome, 60) || 'outro');
  }
  // "Como ficaria": as peças do grupo com esta cor, feitas na hora pelo gerador das prévias (leva cerca de um minuto; a
  // segunda vez é na hora). O pedido diz a peça; para cada peça, a de hoje e a nova, lado a lado, e o que ainda ficou difícil.
  async function verComoFicaria(estilo, g, s, botao, ver, estado) {
    const vez = aberto.vez;
    botao.disabled = true;
    estado.textContent = 'Preparando com esta cor. Leva cerca de um minuto…';
    const r = await enviarPrevias({ acao: 'como-ficaria', estilo: estilo.id, papel: g.papel, cor: s.cor, peca: g.pecas[0] });
    if (r === null || vez !== aberto.vez) return;
    botao.disabled = false;
    if (!r.ok) { estado.textContent = erroDe(r, 'Não consegui preparar a peça com esta cor. Tente de novo.'); return; }
    // só as peças deste grupo, cada endereço da pasta das cores sugeridas da empresa escolhida
    const pecas = lista(objeto(r.json.comoFicaria).pecas).map(objeto)
      .filter((p) => g.pecas.some((x) => mesmaPeca(x, p)) && enderecoDaMarca(p.endereco, 'cores-sugeridas', 3)).slice(0, 6);
    if (!pecas.length) { estado.textContent = 'Não consegui mostrar a peça com esta cor. Tente de novo.'; return; }
    const ainda = pecas.filter((p) => lista(p.dificeis).length);
    // peças que hoje se leem e, com esta cor, ficam difíceis: isso vem antes de tudo
    const pioradas = lista(objeto(r.json.comoFicaria).pioradas).map(objeto).filter((p) => ondeDaPeca(p));
    if (pioradas.length) estado.textContent = 'Com esta cor, estas peças ficam difíceis: ' + pioradas.slice(0, 6).map(textoPiorado).join('; ') + (pioradas.length > 6 ? '; e mais ' + (pioradas.length - 6) : '') + '.';
    else if (!ainda.length) estado.textContent = 'Com esta cor, o texto fica fácil de ler.';
    else {
      estado.textContent = 'Com esta cor, ainda fica difícil de ler: ' + ainda.map((p) => lista(p.dificeis).map((t) => '“' + limpo(t, 40) + '”').filter((t) => t.length > 2).join(', ') + ' ' + ondeDaPeca(p)).join('; ') + '.';
    }
    ver.textContent = '';
    pecas.forEach((p) => {
      const atual = enderecoDaMarca(p.atual);
      ver.appendChild(el('p', { classe: 'rotulo-pequeno', texto: 'O texto ' + ondeDaPeca(p) }));
      ver.appendChild(el('div', { classe: 'lado-dois' }, [
        atual ? el('figure', {}, [imagem(atual, 'Hoje, com as suas cores, ' + ondeDaPeca(p)), el('figcaption', { texto: 'Hoje' })]) : null,
        el('figure', {}, [imagem(enderecoDaMarca(p.endereco, 'cores-sugeridas', 3), 'Com a cor ' + s.cor + ', ' + ondeDaPeca(p)), el('figcaption', { texto: 'Com esta cor' })]),
      ]));
    });
    ver.hidden = false;
  }
  // "Usar esta cor" (contrato com Sua marca): o endereço de "Personalizar" já com o papel e a cor sugerida. Lá a cor aparece
  // no editor daquele papel, marcada como sugerida, e nada é gravado até "Guardar a minha marca". A cor muda em todos os
  // estilos da sua marca (dito na tela, acima das sugestões).
  function usarCor(estilo, g, s) {
    return enderecoPersonalizar(estilo.id, g.papel, s.cor, estilo.proprio);
  }
  // O endereço de "Personalizar" em Sua marca: marca.html?personalizar=<estilo>[&papel=<papel>&cor=<RRGGBB>]&empresa=<empresa>.
  // Papel só da lista, cor só com seis algarismos de código de cor (sem "#"); qualquer outra coisa: nenhum endereço.
  // `proprio`: o estilo é um estilo próprio da empresa (que pode ter o mesmo código de um do catálogo): vai `origem=proprio`.
  function enderecoPersonalizar(id, papel, cor, proprio) {
    const codigo = seletor.atual();
    if (!codigo || typeof id !== 'string' || !id) return null;
    let extra = '';
    if (papel !== undefined || cor !== undefined) {
      if (typeof papel !== 'string' || !Object.prototype.hasOwnProperty.call(NOME_COR, papel)) return null;
      if (typeof cor !== 'string' || !/^#?[0-9A-Fa-f]{6}$/.test(cor)) return null;
      extra = '&papel=' + papel + '&cor=' + cor.replace('#', '').toUpperCase();
    }
    if (proprio === true) extra += '&origem=proprio';
    return 'marca.html?personalizar=' + encodeURIComponent(id) + extra + '&empresa=' + encodeURIComponent(codigo);
  }
  // Os caminhos sem marca, nas seções de Sua marca ("Criar uma identidade do zero" e "Enviar referências do que você gosta").
  function caminhoSemMarca(secao) {
    return 'marca.html?empresa=' + encodeURIComponent(seletor.atual() || '') + '#' + secao;
  }

  // ---- as decisões do detalhe: usar o estilo, personalizar, pedir um estilo novo ----
  function desenharPedidos(estilo) {
    const area = el('div', { classe: 'pedido-area', id: 'pedido-area', hidden: true });
    const aviso = el('p', { classe: 'pedido-aviso', id: 'pedido-aviso', role: 'status', tabindex: '-1' });
    const botoes = Object.keys(PEDIDOS).filter((tipo) => !PEDIDOS[tipo].link).map((tipo) => el('button', {
      classe: tipo === 'usar-estilo' ? 'botao botao-forte' : 'botao', type: 'button', 'data-pedido': tipo,
      'aria-expanded': 'false', 'aria-controls': 'pedido-area', texto: PEDIDOS[tipo].botao,
      onclick: () => abrirPedido(estilo, tipo, area, aviso, botoes),
    }));
    // "Personalizar" leva a Sua marca (o mesmo editor de cores e letras, e os detalhes do estilo)
    const personalizar = enderecoPersonalizar(estilo.id)
      ? el('a', { classe: 'botao', id: 'personalizar', texto: PEDIDOS.personalizar.botao, href: enderecoPersonalizar(estilo.id, undefined, undefined, estilo.proprio), title: PEDIDOS.personalizar.texto() }) : null;
    return el('section', { classe: 'pedidos', 'aria-label': 'Decidir' }, [el('div', { classe: 'acoes' }, [botoes[0], personalizar].concat(botoes.slice(1))), area, aviso]);
  }

  // A confirmação fica na própria página. "Usar este estilo": sem marca, mostra antes a marca que nasce do estilo (decisão
  // 10 A); o botão escolhe na hora. Estilo novo: recado e imagens opcionais, e "Enviar pedido".
  function abrirPedido(estilo, tipo, area, aviso, botoes) {
    const def = PEDIDOS[tipo];
    aviso.textContent = '';
    aviso.className = 'pedido-aviso';
    botoes.forEach((b) => b.setAttribute('aria-expanded', b.getAttribute('data-pedido') === tipo ? 'true' : 'false'));
    area.textContent = '';
    area.setAttribute('data-tipo', tipo);
    let recado = null;
    if (tipo === 'usar-estilo' && ehSeuEstilo(estilo)) {
      // já é o estilo da empresa: nada a confirmar
      area.appendChild(el('p', { texto: 'O estilo ' + estilo.nome + ' já é o da ' + tela.nome + '.' }));
      const fechar = el('button', { classe: 'botao', type: 'button', id: 'pedido-cancelar', texto: 'Fechar', onclick: fecharPedido });
      area.appendChild(el('div', { classe: 'pedido-botoes' }, [fechar]));
      area.hidden = false;
      fechar.focus();
      return;
    }
    if (tipo === 'usar-estilo') {
      const nasce = !tela.marca.definida && !estilo.proprio;
      if (nasce) {
        area.appendChild(el('p', { classe: 'confirmar-titulo', texto: MARCA_NASCE }));
        const quadro = quadroDaMarca(estilo);
        area.appendChild(quadro);
        area.appendChild(el('p', { texto: MARCA_NASCE_NOTA }));
        // as letras de verdade chegam com a lista de letras: o quadro é refeito quando ela chega
        if (!tela.letras) {
          const vez = aberto.vez;
          lerLetras().then(() => { if (vez === aberto.vez && tela.letras && quadro.isConnected) quadro.replaceWith(quadroDaMarca(estilo)); });
        }
      } else {
        area.appendChild(el('p', { texto: tela.marca.definida ? def.texto(tela.nome, estilo.nome) : 'O estilo ' + estilo.nome + ' passa a ser o da ' + tela.nome + '. ' + PROPRIO_SEM_MARCA }));
      }
    } else {
      area.appendChild(el('p', { texto: def.texto(tela.nome, estilo.nome) }));
    }
    if (def.recado) {
      recado = el('textarea', { classe: 'recado', id: 'recado', maxlength: String(LIMITE_RECADO), rows: '4', 'aria-describedby': 'recado-conta' });
      const conta = el('p', { classe: 'recado-conta', id: 'recado-conta' });
      const contar = () => { conta.textContent = recado.value.length + ' de ' + LIMITE_RECADO + ' caracteres'; };
      recado.value = aberto.recado; // o que a pessoa já tinha digitado, se fechou a área e abriu de novo
      recado.addEventListener('input', () => { aberto.recado = recado.value; contar(); });
      contar();
      area.appendChild(el('label', { classe: 'recado-rotulo', for: 'recado', texto: 'Recado para o agente (opcional)' }));
      area.appendChild(recado);
      area.appendChild(conta);
    }
    if (def.imagens) areaDeImagens(area);
    const confirmar = el('button', { classe: 'botao botao-forte', type: 'button', id: 'pedido-confirmar', texto: def.confirmar });
    const cancelar = el('button', { classe: 'botao', type: 'button', id: 'pedido-cancelar', texto: 'Cancelar', onclick: fecharPedido });
    const desligar = botoes.concat(confirmar, cancelar);
    confirmar.addEventListener('click', () => {
      if (tipo === 'usar-estilo') escolherEstilo(estilo, desligar, area, aviso);
      else enviarPedido(estilo, tipo, recado ? recado.value.trim().slice(0, LIMITE_RECADO) : '', desligar, area, aviso);
    });
    area.appendChild(el('div', { classe: 'pedido-botoes' }, [confirmar, cancelar]));
    area.hidden = false;
    (recado || confirmar).focus();
  }

  // ---- imagens do estilo novo (opcionais): área de soltar com miniaturas; cada imagem vai pelo envio de arquivo, que
  // confere o conteúdo e dá o nome, e o pedido leva os nomes devolvidos ----
  const LIMITE_IMAGENS = 12;
  const LIMITE_MB_IMAGEM = 10;
  const TIPOS_DE_IMAGEM = /^image\/[a-z0-9.+-]+$/; // o servidor confere o conteúdo de cada uma (só as imagens que ele aceita passam)
  // Das imagens soltas ou escolhidas, as que cabem (tipo, tamanho e o total de 12) e o motivo de cada recusa.
  function aceitarImagens(novas, ja) {
    const aceitas = [];
    const recusas = [];
    for (const f of novas) {
      const nome = limpo(f && f.name, 60) || 'imagem';
      if (!f || typeof f.type !== 'string' || !TIPOS_DE_IMAGEM.test(f.type)) { recusas.push('“' + nome + '” não é uma imagem.'); continue; }
      if (!(f.size <= LIMITE_MB_IMAGEM * 1024 * 1024)) { recusas.push('“' + nome + '” passa de ' + LIMITE_MB_IMAGEM + ' MB.'); continue; }
      if (ja + aceitas.length >= LIMITE_IMAGENS) { recusas.push('Dá para mandar até ' + LIMITE_IMAGENS + ' imagens; as outras ficaram de fora.'); break; }
      aceitas.push(f);
    }
    return { aceitas, recusas };
  }
  function areaDeImagens(area) {
    const entrada = el('input', { type: 'file', id: 'imagens', accept: 'image/*', multiple: true });
    const miniaturas = el('ul', { classe: 'miniaturas', 'aria-label': 'Imagens escolhidas' });
    const recusa = el('p', { classe: 'imagens-recusa', role: 'status' });
    const soltar = el('label', { classe: 'soltar', for: 'imagens' }, [
      el('strong', { texto: 'Imagens do que você gosta (opcional)' }),
      el('span', { texto: 'Solte aqui ou clique para escolher' }),
      el('small', { texto: 'Até ' + LIMITE_IMAGENS + ' imagens, de até ' + LIMITE_MB_IMAGEM + ' MB cada. Elas são só inspiração: nada é copiado.' }),
      entrada,
    ]);
    const desenharMiniaturas = () => {
      miniaturas.textContent = '';
      aberto.imagens.forEach((x) => miniaturas.appendChild(el('li', {}, [
        el('img', { classe: 'miniatura', src: x.url, alt: x.nome }),
        el('button', { classe: 'miniatura-tirar', type: 'button', 'aria-label': 'Tirar a imagem ' + x.nome, texto: '×', onclick: () => {
          URL.revokeObjectURL(x.url);
          aberto.imagens = aberto.imagens.filter((y) => y !== x);
          desenharMiniaturas();
          entrada.focus();
        } }),
      ])));
    };
    const receber = (arquivos) => {
      const { aceitas, recusas } = aceitarImagens([...arquivos], aberto.imagens.length);
      aceitas.forEach((f) => aberto.imagens.push({ arquivo: f, nome: limpo(f.name, 60) || 'imagem', url: URL.createObjectURL(f) }));
      recusa.textContent = recusas.join(' ');
      desenharMiniaturas();
    };
    entrada.addEventListener('change', () => { receber(entrada.files || []); entrada.value = ''; });
    soltar.addEventListener('dragover', (ev) => { ev.preventDefault(); soltar.classList.add('sobre'); });
    soltar.addEventListener('dragleave', () => soltar.classList.remove('sobre'));
    soltar.addEventListener('drop', (ev) => { ev.preventDefault(); soltar.classList.remove('sobre'); receber((ev.dataTransfer && ev.dataTransfer.files) || []); });
    area.appendChild(soltar);
    area.appendChild(miniaturas);
    area.appendChild(recusa);
    desenharMiniaturas();
  }
  // As imagens escolhidas somem (ao sair do detalhe ou depois do envio certo do pedido).
  function limparImagens() {
    aberto.imagens.forEach((x) => URL.revokeObjectURL(x.url));
    aberto.imagens = [];
  }
  const lerComoDados = (arquivo) => new Promise((ok, falha) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => falha(r.error); r.readAsDataURL(arquivo); });
  // Toda imagem sai por aqui (o seletor põe a empresa escolhida por último no corpo).
  async function enviarArquivo(dados) {
    try { return await seletor.enviar('/api/arquivo', { tipo: 'referencia', dados }); } catch (e) { return { ok: false, json: { erro: SEM_SERVIDOR } }; }
  }

  // ---- a marca que nasce do estilo (decisão 10 A): as cores e as letras de verdade do estilo, num cartão neutro, com o
  // papel de cada cor. É a única prévia que esta tela desenha sozinha; as letras vêm da lista de letras livres. ----
  const PAPEL_NO_QUADRO = { escuro: 'Fundo escuro', claro: 'Fundo claro', acento: 'Destaque', neutro: 'Apoio' };
  // os papéis da marca (marca.exemplo.yaml), com os nomes de Sua marca: `principal` na legenda, nos títulos e no botão;
  // `mono` nos rótulos pequenos em caixa-alta
  const LETRA_NO_QUADRO = { principal: 'Letra principal', mono: 'Letra dos rótulos', acento: 'Destaque' };
  // A cor de texto que mais contrasta com um fundo, entre duas (conta de luminância do contraste de leitura).
  function sobreCor(fundo, a, b) {
    const lum = (c) => {
      const v = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4)));
      return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
    };
    const contraste = (x, y) => { const [l1, l2] = [lum(x), lum(y)].sort((m, n) => n - m); return (l1 + 0.05) / (l2 + 0.05); };
    return contraste(fundo, a) >= contraste(fundo, b) ? a : b;
  }
  function quadroDaMarca(estilo) {
    const cores = objeto(estilo.original.cores);
    const fontes = objeto(estilo.original.fontes);
    const peca = el('div', { classe: 'quadro-peca', 'aria-hidden': 'true' }, [
      el('p', { classe: 'quadro-peca-sobre', texto: 'Sua marca · exemplo' }),
      el('p', { classe: 'quadro-peca-titulo', texto: 'Um título com a sua letra' }),
      el('p', { classe: 'quadro-peca-texto', texto: 'E um texto curto, para ver as cores e as letras juntas.' }),
      el('span', { classe: 'quadro-peca-botao', texto: 'Saiba mais' }),
    ]);
    const q = el('div', { classe: 'quadro-marca', id: 'quadro-marca', role: 'group', 'aria-label': 'A marca que nasce do estilo ' + estilo.nome }, [peca]);
    Object.keys(PAPEL_NO_QUADRO).forEach((k) => { if (corValida(cores[k])) q.style.setProperty('--q-' + k, corValida(cores[k])); });
    if (corValida(cores.acento) && corValida(cores.escuro) && corValida(cores.claro)) q.style.setProperty('--q-sobre-acento', sobreCor(corValida(cores.acento), corValida(cores.escuro), corValida(cores.claro)));
    q.appendChild(el('ul', { classe: 'quadro-cores', 'aria-label': 'Cores' }, Object.keys(PAPEL_NO_QUADRO).map((k) => {
      const a = el('span', { classe: 'amostra-cor', 'aria-hidden': 'true' });
      if (corValida(cores[k])) a.style.setProperty('--amostra', corValida(cores[k]));
      return el('li', { classe: corValida(cores[k]) ? null : 'amostra-vazia' }, [a, el('span', { texto: PAPEL_NO_QUADRO[k] })]);
    })));
    // as letras: cada família com o arquivo da lista de letras livres (endereço conferido) é carregada e usada no quadro
    const letras = Object.keys(LETRA_NO_QUADRO).filter((k) => texto(fontes[k])).map((k) => {
      const familia = texto(fontes[k]);
      const url = tela.letras ? enderecoDeLetra(tela.letras.get(familia)) : null;
      const nome = 'Quadro ' + estilo.id + ' ' + k;
      const usada = url && carregarLetra(nome, url) ? '"' + nome + '", ' : '';
      if (k === 'principal') q.style.setProperty('--q-letra-principal', usada + 'ui-serif, serif');
      if (k === 'mono') q.style.setProperty('--q-letra-rotulo', usada + 'system-ui, sans-serif');
      const aa = el('span', { classe: 'quadro-aa', 'aria-hidden': 'true', texto: 'Aa' });
      if (usada) aa.style.setProperty('font-family', usada + 'serif');
      return el('li', {}, [aa, el('span', { texto: LETRA_NO_QUADRO[k] + ' · ' + familia })]);
    });
    if (letras.length) q.appendChild(el('ul', { classe: 'quadro-letras', 'aria-label': 'Letras' }, letras));
    return q;
  }
  // A letra vem do endereço que o servidor deu (um arquivo da pasta de letras livres). Se não carregar, fica a do sistema.
  function carregarLetra(familia, url) {
    if (!window.FontFace || !document.fonts) return false;
    try {
      const f = new FontFace(familia, 'url("' + url.replace(/"/g, '%22') + '")', { display: 'swap' });
      document.fonts.add(f);
      f.load().catch(() => { /* arquivo de letra com defeito: vale a do sistema */ });
      return true;
    } catch (e) { return false; }
  }
  // A lista de letras livres (família -> endereço do arquivo), lida uma vez por página.
  async function lerLetras() {
    if (tela.letras) return;
    let r = null;
    try { r = await seletor.ler('/api/letras'); } catch (e) { return; }
    if (r === null || !r.ok) return;
    tela.letras = new Map(lista(objeto(r.json).letras).map(objeto).filter((l) => texto(l.familia) && enderecoDeLetra(l.endereco)).map((l) => [l.familia, l.endereco]));
  }

  // "Usar este estilo" (decisão D1): escolhe na hora pelo servidor, que, sem marca, grava antes a marca que nasce do estilo
  // e anota o pedido "usar-estilo" já aplicado (o agente começa o primeiro trabalho). A resposta de outra empresa ou de um
  // detalhe que já fechou não aparece aqui. Depois: "Pronto" com "Desfazer", embaixo (decisão 10 A).
  function corpoDaEscolha(estilo) {
    return { estilo: estilo.id, origem: estilo.proprio ? 'proprio' : 'catalogo', comMarca: !tela.marca.definida && !estilo.proprio };
  }
  async function escolherEstilo(estilo, desligar, area, aviso) {
    const vez = aberto.vez;
    desligar.forEach((b) => { b.disabled = true; });
    aviso.className = 'pedido-aviso';
    aviso.textContent = 'Escolhendo o estilo…';
    let r;
    try {
      r = await seletor.enviar('/api/estilo', corpoDaEscolha(estilo));
    } catch (e) {
      r = { ok: false, json: { erro: SEM_SERVIDOR } };
    } finally {
      desligar.forEach((b) => { b.disabled = false; });
    }
    if (r === null || vez !== aberto.vez) return;
    aviso.textContent = '';
    if (!r.ok) {
      aviso.className = 'pedido-aviso erro';
      aviso.textContent = erroDe(r, 'Não consegui escolher o estilo. Tente de novo.');
      const confirmar = $('pedido-confirmar');
      if (confirmar) confirmar.focus();
      return;
    }
    const marcaCriada = objeto(r.json).marcaCriada === true;
    const paraOClaude = /\/fabrica continuar/.test(texto(objeto(r.json).mensagem)); // o pedido ao agente foi anotado
    area.hidden = true;
    area.textContent = '';
    detalhe.querySelectorAll('[data-pedido]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
    aviso.className = 'pedido-aviso ok';
    const frase = el('span', { classe: 'pronto-frase' }, [el('strong', { texto: 'Pronto.' }), ' O estilo ' + estilo.nome + ' agora é o da ' + tela.nome + '.'
      + (marcaCriada ? ' As cores e letras dele já são as da sua marca.' : '')
      + (paraOClaude ? ' No Claude, digite /fabrica continuar para fazer a primeira peça.' : '')]);
    const desfazer = el('button', { classe: 'botao', type: 'button', id: 'desfazer-escolha', texto: 'Desfazer' });
    desfazer.addEventListener('click', () => desfazerEscolha(estilo, marcaCriada, desfazer, aviso));
    aviso.appendChild(el('span', { classe: 'pronto-linha' }, [frase, desfazer]));
    aviso.focus({ preventScroll: true });
    await depoisDaEscolha(marcaCriada);
  }
  // "Desfazer": volta a escolha de antes (a marca que nasceu do estilo continua: ela tem o próprio "Desfazer" em Sua marca).
  async function desfazerEscolha(estilo, marcaCriada, botao, aviso) {
    const vez = aberto.vez;
    botao.disabled = true;
    let r;
    try {
      r = await seletor.enviar('/api/estilo/desfazer', {});
    } catch (e) {
      r = { ok: false, json: { erro: SEM_SERVIDOR } };
    }
    if (r === null || vez !== aberto.vez) return;
    if (!r.ok) {
      botao.disabled = false;
      aviso.appendChild(el('span', { classe: 'andamento-erro', texto: ' ' + erroDe(r, 'Não consegui desfazer. Tente de novo.') }));
      return;
    }
    const volta = objeto(objeto(r.json).estilo);
    aviso.textContent = '';
    aviso.className = 'pedido-aviso ok';
    aviso.appendChild(el('strong', { texto: 'Desfeito.' }));
    aviso.appendChild(document.createTextNode(texto(volta.id) ? ' O seu estilo voltou a ser ' + (limpo(volta.nome, 80) || volta.id) + '.' : ' Nenhum estilo está escolhido agora.'));
    if (marcaCriada) {
      aviso.appendChild(document.createTextNode(' A marca que nasceu do estilo ' + estilo.nome + ' continua; dá para trocá-la em '));
      aviso.appendChild(el('a', { href: caminhoSemMarca('sua-marca'), texto: 'Sua marca' }));
      aviso.appendChild(document.createTextNode('.'));
    }
    aviso.focus({ preventScroll: true });
    await depoisDaEscolha(false);
  }
  // Depois de escolher ou desfazer: relê o catálogo (o estilo escolhido e a marca), pinta a página com a marca nova
  // quando ela acabou de nascer, e relê o andamento dos pedidos.
  async function depoisDaEscolha(marcaCriada) {
    if (marcaCriada) {
      const m = await seletor.aplicarMarca();
      if (m && !m.exemplo) { tela.marcaDaEmpresa = { cores: objeto(m.cores), fontes: objeto(m.fontes) }; $('nota-exemplo').hidden = true; }
    }
    await recarregarCatalogo();
    lerPedidos();
  }

  // Só esconde a área: o recado digitado continua guardado (aberto.recado) para quando a pessoa abrir de novo.
  function fecharPedido() {
    const area = $('pedido-area');
    if (!area || area.hidden) return;
    const tipo = area.getAttribute('data-tipo');
    area.hidden = true;
    detalhe.querySelectorAll('[data-pedido]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
    const botao = detalhe.querySelector('[data-pedido="' + tipo + '"]');
    if (botao) botao.focus();
  }

  // O pedido sai pelo seletor (que põe a empresa escolhida por último no corpo). Enquanto ele vai, os botões ficam
  // desligados. Resposta de outra empresa (a pessoa trocou no meio) ou de um detalhe que já fechou não aparece aqui.
  async function enviarPedido(estilo, tipo, recado, desligar, area, aviso) {
    const vez = aberto.vez;
    const corpo = { tipo, estilo: estilo.id };
    if (recado) corpo.nota = recado;
    const imagens = tipo === 'estilo-novo' ? aberto.imagens.slice() : [];
    desligar.forEach((b) => { b.disabled = true; });
    aviso.className = 'pedido-aviso';
    aviso.textContent = 'Enviando o pedido…';
    let r;
    try {
      // as imagens vão antes, uma por vez (o servidor confere cada uma e dá o nome); se uma não passa, o pedido não sai.
      // A que já subiu guarda o nome dado pelo servidor (com a empresa): se o pedido for recusado e a pessoa mandar de
      // novo, ela não sobe outra vez (nada de imagem sobrando na pasta da empresa).
      const anexos = [];
      const dona = seletor.atual(); // a imagem que subiu vale só para a pasta desta empresa
      for (let i = 0; i < imagens.length; i += 1) {
        const ja = imagens[i].enviada;
        if (ja && ja.dona === dona && texto(ja.nome)) { anexos.push(ja.nome); continue; }
        aviso.textContent = 'Enviando as imagens: ' + (i + 1) + ' de ' + imagens.length + '…';
        const env = await enviarArquivo(await lerComoDados(imagens[i].arquivo));
        if (env === null) { r = null; break; }
        if (!env.ok || !texto(objeto(env.json).nome)) { r = { ok: false, json: { erro: 'A imagem “' + imagens[i].nome + '” não foi aceita. ' + erroDe(env, 'Tente outra.') } }; break; }
        imagens[i].enviada = { dona, nome: env.json.nome };
        anexos.push(env.json.nome);
      }
      if (r === undefined) {
        if (anexos.length) corpo.anexos = anexos;
        r = await seletor.enviar('/api/pedido', corpo);
      }
    } catch (e) {
      r = { ok: false, json: { erro: 'Não consegui falar com o servidor dos painéis. Confira se a janela do servidor continua aberta e tente de novo.' } };
    } finally {
      desligar.forEach((b) => { b.disabled = false; });
    }
    if (r === null || vez !== aberto.vez) return;
    aviso.textContent = '';
    if (!r.ok) {
      aviso.className = 'pedido-aviso erro';
      aviso.textContent = erroDe(r, 'Não consegui enviar o pedido. Tente de novo.');
      const confirmar = $('pedido-confirmar'); // o foco volta para o botão que a pessoa acabou de apertar (já religado)
      if (confirmar) confirmar.focus();
      return;
    }
    if (tipo === 'estilo-novo') aberto.recado = ''; // enviado: agora sim o recado e as imagens do estilo novo podem sumir
    area.hidden = true;
    area.textContent = '';
    if (tipo === 'estilo-novo') limparImagens();
    detalhe.querySelectorAll('[data-pedido]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
    aviso.className = 'pedido-aviso ok';
    aviso.appendChild(el('strong', { texto: 'Pedido anotado para ' + tela.nome + '.' }));
    aviso.appendChild(document.createTextNode(' ' + texto(r.json.mensagem)));
    aviso.focus({ preventScroll: true });
    lerPedidos(); // o pedido novo aparece na faixa do alto
  }

  iniciar();
})();
</script>
</body>
</html>
